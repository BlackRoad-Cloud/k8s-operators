apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackroad-agents
  namespace: blackroad
  labels:
    app: blackroad-agents
spec:
  replicas: 3
  selector:
    matchLabels:
      app: blackroad-agents
  template:
    metadata:
      labels:
        app: blackroad-agents
    spec:
      containers:
        - name: agent-runtime
          image: ghcr.io/blackroad-os-inc/agent-runtime:latest
          ports:
            - containerPort: 8080
          env:
            - name: GATEWAY_URL
              value: "http://blackroad-gateway:8787"
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: blackroad-agents
  namespace: blackroad
spec:
  selector:
    app: blackroad-agents
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
