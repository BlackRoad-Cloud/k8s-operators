replicaCount:
  agents: 3
  gateway: 2

image:
  registry: ghcr.io/blackroad-os-inc
  pullPolicy: IfNotPresent

gateway:
  port: 8787
  resources:
    requests: { memory: "128Mi", cpu: "50m" }
    limits: { memory: "256Mi", cpu: "250m" }

agents:
  port: 8080
  resources:
    requests: { memory: "256Mi", cpu: "100m" }
    limits: { memory: "512Mi", cpu: "500m" }

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: api.blackroad.io
      paths: [{ path: /, pathType: Prefix, service: gateway }]
    - host: agents.blackroad.io
      paths: [{ path: /, pathType: Prefix, service: agents }]
  tls:
    - secretName: blackroad-tls
      hosts: [api.blackroad.io, agents.blackroad.io]
