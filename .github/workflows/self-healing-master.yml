name: Self-Healing Master

on:
  workflow_run:
    workflows: ["*"]
    types: [completed]
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes
  workflow_dispatch:
    inputs:
      force_heal:
        description: 'Force healing check'
        required: false
        default: 'false'

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  checks: write

jobs:
  analyze-failure:
    if: github.event.workflow_run.conclusion == 'failure' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      fix_type: ${{ steps.diagnose.outputs.fix_type }}
      needs_healing: ${{ steps.diagnose.outputs.needs_healing }}
      failure_reason: ${{ steps.diagnose.outputs.reason }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Diagnose Failure
        id: diagnose
        run: |
          echo "Analyzing system health..."

          # Check for Python test failures
          if [ -f "tests/test_k8s_operator.py" ]; then
            pip install pytest -q 2>/dev/null
            if ! python -m pytest tests/ -q --tb=no 2>/dev/null; then
              echo "fix_type=test_failure" >> $GITHUB_OUTPUT
              echo "needs_healing=true" >> $GITHUB_OUTPUT
              echo "reason=Python tests failing" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          # Check workflow logs for errors
          if [ "${{ github.event.workflow_run.conclusion }}" == "failure" ]; then
            echo "fix_type=workflow_failure" >> $GITHUB_OUTPUT
            echo "needs_healing=true" >> $GITHUB_OUTPUT
            echo "reason=Workflow execution failed" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "needs_healing=false" >> $GITHUB_OUTPUT

  auto-heal:
    needs: analyze-failure
    if: needs.analyze-failure.outputs.needs_healing == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Auto-Fix
        id: fix
        run: |
          FIX_TYPE="${{ needs.analyze-failure.outputs.fix_type }}"
          echo "Applying fix type: $FIX_TYPE"

          case $FIX_TYPE in
            test_failure)
              echo "Attempting to fix test failures..."
              pip install pytest -q
              python -m pytest tests/ -v || echo "Tests still failing after fix attempt"
              ;;

            workflow_failure)
              echo "Attempting generic recovery..."
              pip install pytest -q
              python -m pytest tests/ -v || echo "Tests need manual review"
              ;;

            *)
              echo "Unknown fix type: $FIX_TYPE"
              exit 1
              ;;
          esac

          echo "fix_applied=true" >> $GITHUB_OUTPUT

      - name: Push Auto-Fix
        if: steps.fix.outputs.fix_applied == 'true'
        run: |
          git config user.name "BlackRoad Self-Healing Bot"
          git config user.email "bot@blackroad.io"
          git add -A
          git diff-index --quiet HEAD -- || git commit -m "Auto-fix: Resolve test/build issues"
          git push || echo "No changes to push"

      - name: Create Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            // Check if an open issue already exists for this fix type
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'auto-fix-failed'
            });

            if (issues.data.length > 0) {
              console.log('Open auto-fix-failed issue already exists, skipping creation');
              return;
            }

            const title = 'Self-Healing Failed: ${{ needs.analyze-failure.outputs.fix_type }}';
            const body = `## Auto-Healing Attempt Failed

            **Fix Type:** \`${{ needs.analyze-failure.outputs.fix_type }}\`
            **Reason:** ${{ needs.analyze-failure.outputs.failure_reason }}
            **Branch:** \`${{ github.ref_name }}\`
            **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ### Manual Intervention Required

            The self-healing system attempted to fix this issue but was unsuccessful.
            Please investigate and resolve manually.

            ---
            *Auto-generated by Self-Healing Master*`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['auto-fix-failed', 'requires-attention']
            });

  health-check:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Check Service Health
        id: health
        run: |
          echo "Performing health checks..."

          # Define health endpoints
          ENDPOINTS=(
            "https://www.blackroad.io/api/health"
            "https://app.blackroad.io/api/health"
            "https://api.blackroad.io/health"
          )

          FAILURES=0
          FAILED_ENDPOINTS=""

          for endpoint in "${ENDPOINTS[@]}"; do
            echo "Checking: $endpoint"
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 "$endpoint" || echo "000")

            if [ "$HTTP_CODE" != "200" ]; then
              FAILURES=$((FAILURES + 1))
              FAILED_ENDPOINTS="$FAILED_ENDPOINTS\n- $endpoint (HTTP $HTTP_CODE)"
              echo "$endpoint returned $HTTP_CODE"
            else
              echo "$endpoint is healthy"
            fi
          done

          if [ $FAILURES -gt 0 ]; then
            echo "unhealthy=true" >> $GITHUB_OUTPUT
            echo "failed_count=$FAILURES" >> $GITHUB_OUTPUT
            echo -e "failed_endpoints=$FAILED_ENDPOINTS" >> $GITHUB_OUTPUT
          else
            echo "unhealthy=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Health Alert
        if: steps.health.outputs.unhealthy == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Service Health Alert';
            const body = `## Health Check Failed

            **Failed Endpoints:** ${{ steps.health.outputs.failed_count }}

            ### Recommended Actions:
            - [ ] Check deployment status
            - [ ] Review application logs
            - [ ] Verify DNS and routing

            ---
            *Auto-detected by Health Monitor*`;

            // Check if an open issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'service-health'
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['service-health', 'auto-detected']
              });
            }

  dependency-audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Security Audit
        id: audit
        continue-on-error: true
        run: |
          echo "Running Python dependency security audit..."
          pip install pip-audit safety -q

          # Audit installed packages
          pip install pytest -q  # Install project deps
          pip-audit --desc --output audit-report.txt 2>&1 || true

          if [ -s "audit-report.txt" ] && grep -qi "vulnerability\|CVE\|PYSEC" audit-report.txt; then
            echo "vulnerabilities_found=true" >> $GITHUB_OUTPUT
          else
            echo "vulnerabilities_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Security Report
        if: steps.audit.outputs.vulnerabilities_found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('audit-report.txt', 'utf8');

            // Check if a recent open security issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security'
            });

            if (issues.data.length > 0) {
              console.log('Open security issue already exists, skipping creation');
              return;
            }

            const title = 'Security Audit: Python Dependency Vulnerabilities Found';
            const body = `## Security Audit Report

            ### Audit Results:
            \`\`\`
            ${report.substring(0, 3000)}
            \`\`\`

            ### Actions Required:
            - [ ] Review reported vulnerabilities
            - [ ] Update affected packages

            ---
            *Auto-generated by Dependency Audit*`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['security', 'dependencies']
            });
