name: Cleanup Stale Bot Issues

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-stale-issues.yml'

permissions:
  issues: write
  pull-requests: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Close duplicate Security Audit issues
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Get all open issues
            let page = 1;
            let allIssues = [];
            while (true) {
              const { data: issues } = await github.rest.issues.listForRepo({
                owner, repo,
                state: 'open',
                per_page: 100,
                page: page++,
              });
              if (issues.length === 0) break;
              allIssues = allIssues.concat(issues);
            }

            console.log(`Found ${allIssues.length} open issues`);

            const closureComment = 'Closing: this issue was auto-generated by a misconfigured workflow (npm audit on a Python project). The workflows have been fixed to use Python-appropriate tooling.';

            for (const issue of allIssues) {
              // Skip pull requests
              if (issue.pull_request) continue;

              const title = issue.title;
              const isSecurityAuditSpam = title.includes('Security Audit: Vulnerabilities Auto-Fixed');
              const isSelfHealingFailed = title.includes('Self-Healing Failed');
              const isCodeQLFailed = title.includes('CodeQL Security Analysis Failed');
              const isBotGenerated = issue.user.login === 'github-actions[bot]';

              if (isBotGenerated && (isSecurityAuditSpam || isSelfHealingFailed || isCodeQLFailed)) {
                console.log(`Closing issue #${issue.number}: ${title}`);
                await github.rest.issues.createComment({
                  owner, repo,
                  issue_number: issue.number,
                  body: closureComment,
                });
                await github.rest.issues.update({
                  owner, repo,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'not_planned',
                });
              }
            }

            console.log('Cleanup complete');

      - name: Close stale draft PR #931
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: 931,
                state: 'closed',
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 931,
                body: 'Closing: this draft PR was an audit trail for a declined security request. No code changes were made.',
              });
              console.log('PR #931 closed');
            } catch (e) {
              console.log(`Could not close PR #931: ${e.message}`);
            }
