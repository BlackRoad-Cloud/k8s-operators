name: Test Auto-Heal on Failure

on:
  workflow_run:
    workflows: ["CI", "K8s Operators CI"]
    types: [completed]
  push:
    branches: [main, master, develop]
    paths:
      - 'src/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  test-runner:
    if: github.event.workflow_run.conclusion == 'failure' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        id: install
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Tests
        id: test
        continue-on-error: true
        run: |
          if [ -f "tests/test_k8s_operator.py" ]; then
            python -m pytest tests/ -v --tb=short
          else
            echo "No tests found, skipping..."
          fi

      - name: Auto-Heal on Failure
        if: steps.test.outcome == 'failure'
        run: |
          echo "Tests failed, attempting auto-heal..."

          # Re-run with verbose output for diagnosis
          python -m pytest tests/ -v --tb=long 2>&1 || true

          echo "Auto-heal diagnostics complete. Manual review may be required."

      - name: Report Results
        if: always()
        run: |
          echo "## Test & Heal Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Install: ${{ steps.install.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: ${{ steps.test.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.test.outcome }}" == "failure" ]; then
            echo "Auto-heal was triggered" >> $GITHUB_STEP_SUMMARY
          else
            echo "No healing required - all checks passed" >> $GITHUB_STEP_SUMMARY
          fi
